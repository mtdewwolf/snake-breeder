name: Android

on:
  push:
    paths: ['index.html', 'css/**', 'js/**', 'android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'css/**', 'js/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs and run lint
        run: ./gradlew assembleDebug assembleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: clutch-and-coil-apks
          path: android/app/build/outputs/apk/**/*.apk
